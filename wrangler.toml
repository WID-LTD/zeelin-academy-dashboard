name = "zeelin-academy-dashboard"
main = "_worker.js"
compatibility_date = "2024-08-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./"
not_found_handling = "404-page"

# Run `npx wrangler deploy` — serves ./ as static assets + auth Worker
# For Cloudflare Pages, do NOT set a deploy command; Pages auto-deploys static.
# If using Pages, set Build command: npm install && npm run build (or empty) and leave Deploy empty.
