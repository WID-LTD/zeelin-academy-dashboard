<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>In-House Project Portal — Daily Check-In</title>
<style>
body{margin:0;background:#121212;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px}
.layout{display:flex;height:100vh}
.sb{width:280px;background:#181818;border-right:1px solid #2a2a2a;display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.sb-head{padding:20px 16px;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;gap:10px}
.sb-brand{width:28px;height:28px;background:#d97706;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff;font-size:14px}
.sb-title{font-size:14px;font-weight:600;color:#fff;line-height:1.2}
.sb-nav{padding:12px 8px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.sb-nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;color:#a3a3a3;border-radius:6px;text-decoration:none}
.sb-nav a.active{background:#262626;color:#fff;font-weight:500}
.sb-nav a.active svg{fill:#d97706}
.sb-nav a svg{width:16px;height:16px;fill:currentColor}
.slabel{padding:16px 12px 6px;font-size:11px;font-weight:600;color:#737373;letter-spacing:.5px}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:#181818;border-bottom:1px solid #2a2a2a;padding:12px 24px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.topbar-title{font-size:13px;font-weight:600;color:#fff}
.content{flex:1;padding:32px 40px;overflow-y:auto;background:#121212}
.checkin-wrap{max-width:700px;margin:0 auto}
.checkin-hero{text-align:center;padding:40px 24px 24px}
.checkin-hero h1{font-size:26px;font-weight:700;color:#fff;margin:0 0 6px}
.checkin-hero p{font-size:13px;color:#a3a3a3;margin:0}
.block{background:#181818;border:1px solid #2a2a2a;border-radius:12px;padding:24px;margin-bottom:20px}
.block label{display:block;font-size:14px;font-weight:600;color:#fff;margin-bottom:8px}
.block input[type=text],.block textarea{width:100%;background:#161616;border:1px solid #2e2e2e;border-radius:8px;padding:12px 14px;color:#d4d4d4;font-size:13px;font-family:inherit;resize:vertical}
.block textarea{min-height:80px}
.block input[type=text]:focus,.block textarea:focus{outline:none;border-color:#d97706}
.stars{display:flex;gap:8px;margin-bottom:8px}
.star-btn{background:none;border:1px solid #333;width:36px;height:36px;border-radius:6px;cursor:pointer;font-size:16px;color:#737373}
.star-btn.active{background:#26170b;border-color:#d97706;color:#d97706}
.star-branch{margin-top:8px;display:none}
.star-branch.show{display:block}
.star-branch textarea{min-height:60px}
.claim-bar{display:flex;justify-content:space-between;align-items:center;background:#181818;border:1px solid #2a2a2a;border-radius:12px;padding:20px 24px}
.claim-bar .info{font-size:13px;color:#a3a3a3}
.claim-bar .info b{color:#d97706}
.btn-claim{background:#d97706;color:#fff;border:none;padding:12px 24px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer}
.btn-claim:disabled{opacity:.5;cursor:not-allowed}
.streak{display:flex;align-items:center;gap:12px;margin-top:16px;font-size:12px;color:#a3a3a3}
.streak-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.streak-dot.done{background:#14532d;color:#4ade80}
.streak-dot.today{background:#d97706;color:#fff}
.streak-dot.future{background:#262626;color:#525252}
</style>
</head>
<body>
<div class="layout">
  <div class="sb">
    <div class="sb-head"><div class="sb-brand">W</div><span class="sb-title">In-House Project Training Portal</span></div>
    <div class="sb-nav">
      <a href="#"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg><span>Portal Overview</span></a>
      <div class="slabel">DAILY ROUTINE</div>
      <a class="active" href="#"><svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg><span>Daily Check-In</span></a>
      <a href="#"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg><span>Accountability</span></a>
    </div>
  </div>
  <div class="main">
    <div class="topbar"><svg viewBox="0 0 24 24" fill="#d97706" width="18" height="18"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg><span class="topbar-title">Daily Check-In</span></div>
    <div class="content">
      <div class="checkin-wrap">
        <div class="checkin-hero"><h1>Daily Check-In</h1><p>Track your progress and earn XP by completing your daily accountability check-in.</p></div>
        <div class="block"><label>What did you work on today?</label><textarea placeholder="Describe your project work..."></textarea></div>
        <div class="block"><label>Energy Level</label><input type="text" placeholder="e.g., High, Medium, Low"/></div>
        <div class="block"><label>Rate Your Focus Today</label><div class="stars"><button class="star-btn active">1</button><button class="star-btn active">2</button><button class="star-btn active">3</button><button class="star-btn">4</button><button class="star-btn">5</button></div><div class="star-branch show"><label>What made it a 3-star day?</label><textarea placeholder="Optional feedback..."></textarea></div></div>
        <div class="block"><label>One thing to improve tomorrow</label><input type="text" placeholder="e.g., Start spreadsheet earlier"/></div>
        <div class="block"><label>Any blockers or unclear tasks?</label><textarea placeholder="Optional..."></textarea></div>
        <div class="claim-bar"><div class="info">Complete check-in to earn <b>+500 XP</b></div><button class="btn-claim">Submit Check-In</button></div>
        <div class="streak"><div class="streak-dot done">M</div><div class="streak-dot done">T</div><div class="streak-dot today">W</div><div class="streak-dot future">T</div><div class="streak-dot future">F</div><div class="streak-dot future">S</div><div class="streak-dot future">S</div></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
